[package]
name = "dab-app"
description = "DAB Classic: GUI-unabhaengige App-Logik (Einstellungen, Presets, Timer, EPG-Cache, Timeshift-Steuerung, Aufnahme-Regeln)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
dab-api = { workspace = true }
dab-music = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
# TPEG (crate::tpeg): Dienstrahmen der ARD sind zlib-gepackt (reiner Rust-Backend)
flate2 = "1"
# RadioDNS (crate::radiodns): DNS ueber den System-Resolver, HTTP(S) ueber
# den Windows-Zertifikatspeicher (schannel) - kein rustls/nasm noetig.
hickory-resolver = { version = "0.24", default-features = false, features = ["system-config", "tokio-runtime"] }
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
